# Supply-chain cooldown: don't resolve dependency versions published less than
# 24h ago (1440 minutes). Overrides the (longer) global pnpm config for this repo.
minimumReleaseAge: 1440

# Exclude @geoman-io packages from the cooldown so freshly-published geoman
# releases can be installed immediately. All other dependencies still wait 24h.
minimumReleaseAgeExclude:
  - "@geoman-io/*"

# core-js ships a postinstall script that only prints a funding message; the
# docs build does not need it to run.
allowBuilds:
  core-js: false
