# Exclude @geoman-io packages from the global minimumReleaseAge supply-chain
# cooldown so freshly-published geoman releases can be installed immediately.
# All other dependencies still respect the cooldown.
minimumReleaseAgeExclude:
  - "@geoman-io/*"

# core-js ships a postinstall script that only prints a funding message; the
# docs build does not need it to run.
allowBuilds:
  core-js: false
